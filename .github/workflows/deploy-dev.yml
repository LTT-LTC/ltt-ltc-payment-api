name: Deploy Dev - Payment Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: dranov220805/ltt-ltc-payment-api
      SERVICE_NAME: ltt-ltc-payment-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -f LTC.PaymentService.HttpApi.Host/Dockerfile -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.109.240.84 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH (optional but recommended)
        run: |
          ssh -o StrictHostKeyChecking=no dranov@100.109.240.84 "echo SSH OK"

      - name: SSH Deploy
        run: |
          ssh -o StrictHostKeyChecking=no dranov@100.109.240.84 << 'EOF'
            cd /home/dranov/Desktop/ltt-ltc

            docker compose pull ltt-ltc-payment-api
            docker compose up -d --no-deps ltt-ltc-payment-api
          EOF


